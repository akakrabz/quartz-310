<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convolution explorer — ECE 310</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #23211d; --muted: #7a766e; --line: #e0ddd5; --panel: #f1efe9;
    --accent: #0e6b73; --accent2: #b5632a; --hi: #d1495b;
  }
  :root[data-theme="dark"] {
    --bg: #161719; --fg: #eceef1; --muted: #9a9ea6; --line: #2f3238; --panel: #1f2125;
    --accent: #6cc4c9; --accent2: #e8a066; --hi: #f0907c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 10px; max-width: 1000px; margin: 0 auto; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .grow { flex: 1 1 220px; min-width: 0; }
  label.f { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  input[type=text], input[type=number] { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  input[type=text] { width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
  input[type=number] { width: 4.6em; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button, select { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  select { max-width: 100%; min-width: 0; }
  .grow select { flex: 1 1 auto; width: 100%; text-overflow: ellipsis; }
  input[type=range] { flex: 1 1 160px; min-width: 120px; accent-color: var(--accent); }
  .seqrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; }
  .seqrow .nm { font-weight: 600; white-space: nowrap; }
  .seqrow .nm.x { color: var(--accent); } .seqrow .nm.h { color: var(--accent2); }
  .panel { background: var(--panel); border-radius: 8px; padding: 8px 10px; }
  .note { color: var(--muted); font-size: 13px; }
  .err { color: var(--hi); font-weight: 600; min-height: 0; }
  .err:empty { display: none; }
  canvas { width: 100%; display: block; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
  .readout { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .readout b.v { color: var(--hi); }
  .seq { display: inline; padding-bottom: 1em; }
  .s { position: relative; display: inline-block; line-height: 1.15; }
  .s.z { color: var(--hi); font-weight: 700; }
  .s.z::after { content: "↑"; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); font-size: 12px; line-height: 1; color: var(--hi); font-weight: 700; }
  .seqline { line-height: 2.3; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 4px 16px; font-variant-numeric: tabular-nums; }
  .facts b { color: var(--accent); }
  h3 { font-size: 14px; margin: 2px 0 4px; font-weight: 700; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.t { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  table.t th, table.t td { padding: 2px 7px; text-align: center; white-space: nowrap; }
  table.t th { color: var(--muted); font-weight: 600; }
  table.t td.lab, table.t th.lab { text-align: right; color: var(--muted); border-right: 1px solid var(--line); }
  table.t td.res { text-align: left; border-left: 1px solid var(--line); }
  table.t tr.xrow td { border-bottom: 1px solid var(--line); color: var(--accent); font-weight: 600; }
  table.t tr.hd th { border-bottom: 1px solid var(--line); }
  table.t td.g { color: var(--accent2); }
  table.t tr.cur td { background: color-mix(in srgb, var(--hi) 14%, transparent); }
  table.t tr.nr { cursor: pointer; }
  table.t tr.nr:hover td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  table.m td { padding: 1px 6px; }
  table.m td.mH { background: color-mix(in srgb, var(--accent2) 9%, transparent); }
  table.m td.mH.l { border-left: 2px solid var(--fg); } table.m td.mH.r { border-right: 2px solid var(--fg); }
  table.m td.mx { background: color-mix(in srgb, var(--accent) 10%, transparent); border-left: 2px solid var(--fg); border-right: 2px solid var(--fg); color: var(--accent); font-weight: 600; }
  table.m td.my { background: color-mix(in srgb, var(--hi) 9%, transparent); border-left: 2px solid var(--fg); border-right: 2px solid var(--fg); font-weight: 600; }
  table.m td.op { color: var(--muted); padding: 0 4px; }
  table.m td.blank { border: 0; background: none; }
  table.m td.zero { color: var(--muted); }
  table.m tr.cur td.mH, table.m tr.cur td.my { background: color-mix(in srgb, var(--hi) 22%, transparent); }
  table.m td.mark { color: var(--hi); text-align: left; font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  @media (max-width: 560px) {
    .wrap { padding: 8px; gap: 8px; }
    .seqrow { grid-template-columns: auto minmax(0, 1fr); }
    .seqrow .st { grid-column: 2; }
    table.t { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="bar">
    <label class="f grow">Preset
      <select id="preset" title="load an example"></select>
    </label>
  </div>
  <div class="note" id="pnote"></div>
  <div class="panel" style="display:grid; gap:6px">
    <div class="seqrow">
      <span class="nm x">x[n] =</span>
      <input type="text" id="xin" spellcheck="false" autocomplete="off" aria-label="samples of x, comma separated">
      <label class="f st">starts at n = <input type="number" id="xs" step="1" aria-label="index of the first sample of x"></label>
    </div>
    <div class="seqrow">
      <span class="nm h">h[n] =</span>
      <input type="text" id="hin" spellcheck="false" autocomplete="off" aria-label="samples of h, comma separated">
      <label class="f st">starts at n = <input type="number" id="hs" step="1" aria-label="index of the first sample of h"></label>
    </div>
    <div class="note">Comma-separated samples, left to right; fractions such as 1/4 or −1/2 are fine. “Starts at” is the index of the first entry (the arrow ↑ marks n = 0).</div>
    <div class="err" id="err"></div>
  </div>

  <div class="bar">
    <button id="prev" title="n − 1" aria-label="previous n">◀</button>
    <input type="range" id="nslider" step="1" aria-label="output index n">
    <button id="next" title="n + 1" aria-label="next n">▶</button>
    <button id="play" title="step through every n">play</button>
    <label class="f">flip
      <select id="flip" title="which sequence is flipped and shifted">
        <option value="h">h (y = Σ x[k] h[n−k])</option>
        <option value="x">x (y = Σ h[k] x[n−k])</option>
      </select>
    </label>
  </div>

  <div class="panel readout" id="cur"></div>
  <canvas id="cv1" aria-label="shift view: fixed sequence, flipped and shifted sequence, and their products on a common k axis"></canvas>
  <div class="legend" id="leg1"></div>
  <canvas id="cv2" aria-label="output y[n]"></canvas>

  <div class="panel">
    <div class="seqline" id="yseq"></div>
    <div class="facts" id="facts"></div>
    <div class="note" id="py"></div>
  </div>

  <div>
    <h3 id="ttitle">Shift-and-overlap table</h3>
    <div class="note" id="tnote"></div>
    <div class="scroll"><table class="t" id="tab"></table></div>
  </div>
  <div>
    <h3 id="mtitle">Matrix–vector form</h3>
    <div class="note" id="mnote"></div>
    <div class="scroll"><table class="t m" id="mat"></table></div>
  </div>
</div>
<script>
/*CORE-BEGIN*/
/* ---- pure math, no DOM (the verification script in verify/demos/ runs this block in Node) ---- */
const MINUS = '−';
const Cx = (() => {
  const C = (re, im = 0) => ({ re, im });
  const add = (a, b) => C(a.re + b.re, a.im + b.im);
  const sub = (a, b) => C(a.re - b.re, a.im - b.im);
  const mul = (a, b) => C(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
  const div = (a, b) => {
    if (Math.abs(b.re) >= Math.abs(b.im)) {
      if (b.re === 0) return C(NaN, NaN);
      const r = b.im / b.re, d = b.re + b.im * r;
      return C((a.re + a.im * r) / d, (a.im - a.re * r) / d);
    }
    const r = b.re / b.im, d = b.re * r + b.im;
    return C((a.re * r + a.im) / d, (a.im * r - a.re) / d);
  };
  const neg = a => C(-a.re, -a.im);
  const scale = (a, s) => C(a.re * s, a.im * s);
  const abs = a => Math.hypot(a.re, a.im);
  const arg = a => Math.atan2(a.im, a.re);
  const exp = a => { const m = Math.exp(a.re); return C(m * Math.cos(a.im), m * Math.sin(a.im)); };
  const log = a => C(Math.log(abs(a)), arg(a));
  const sqrt = a => {
    const r = abs(a); if (r === 0) return C(0);
    const t = Math.sqrt((r + Math.abs(a.re)) / 2);
    return a.re >= 0 ? C(t, a.im / (2 * t)) : C(Math.abs(a.im) / (2 * t), a.im >= 0 ? t : -t);
  };
  const powInt = (a, n) => {
    let r = C(1), b = a, k = Math.abs(n);
    while (k) { if (k & 1) r = mul(r, b); b = mul(b, b); k = Math.floor(k / 2); }
    return n < 0 ? div(C(1), r) : r;
  };
  const pow = (a, b) => {
    if (b.im === 0 && Number.isInteger(b.re) && Math.abs(b.re) <= 1e6) return powInt(a, b.re);
    if (a.re === 0 && a.im === 0) return C(0);
    return exp(mul(b, log(a)));
  };
  const cos = a => scale(add(exp(C(-a.im, a.re)), exp(C(a.im, -a.re))), 0.5);
  const sin = a => div(sub(exp(C(-a.im, a.re)), exp(C(a.im, -a.re))), C(0, 2));
  return { C, add, sub, mul, div, neg, scale, abs, arg, exp, log, sqrt, powInt, pow, cos, sin };
})();

const Parse = (() => {
  const { C, add, sub, mul, div, neg, exp, sqrt, pow, cos, sin, abs } = Cx;
  const NAMES = ['sqrt', 'exp', 'cos', 'sin', 'pi', 'π', 'j', 'i', 'e'];
  function tokenize(src) {
    const s = src.replace(/[−–]/g, '-').replace(/[·×]/g, '*').replace(/√/g, 'sqrt');
    const toks = []; let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (/\s/.test(ch)) { i++; continue; }
      const m = /^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/.exec(s.slice(i));
      if (m) { toks.push({ t: 'num', v: parseFloat(m[0]), s: m[0] }); i += m[0].length; continue; }
      if ('+-*/^()'.includes(ch)) { toks.push({ t: ch }); i++; continue; }
      const w = /^[a-zA-Zπ]+/.exec(s.slice(i));
      if (w) {
        let word = w[0].toLowerCase(); i += w[0].length;
        while (word.length) {
          const nm = NAMES.filter(n => word.startsWith(n)).sort((a, b) => b.length - a.length)[0];
          if (!nm) throw new Error(`unknown name "${w[0]}"`);
          toks.push({ t: 'id', v: nm }); word = word.slice(nm.length);
        }
        continue;
      }
      throw new Error(`unexpected character "${ch}"`);
    }
    return toks;
  }
  function expr(src) {
    const toks = tokenize(src);
    if (!toks.length) throw new Error('empty entry');
    let p = 0;
    const peek = () => toks[p], next = () => toks[p++];
    const isFn = t => t && t.t === 'id' && ['sqrt', 'exp', 'cos', 'sin'].includes(t.v);
    function sum() {
      let v = product();
      while (peek() && (peek().t === '+' || peek().t === '-')) { const op = next().t; const r = product(); v = op === '+' ? add(v, r) : sub(v, r); }
      return v;
    }
    function product() {
      let v = unary();
      for (;;) {
        const t = peek(); if (!t) break;
        if (t.t === '*' || t.t === '/') { next(); const r = unary(); v = t.t === '*' ? mul(v, r) : div(v, r); continue; }
        if (t.t === 'id' || t.t === '(') { v = mul(v, power()); continue; }
        if (t.t === 'num') throw new Error('two numbers in a row — separate the entries with commas');
        break;
      }
      return v;
    }
    function unary() {
      const t = peek();
      if (t && (t.t === '-' || t.t === '+')) { next(); const v = unary(); return t.t === '-' ? neg(v) : v; }
      return power();
    }
    function power() { const b = atom(); if (peek() && peek().t === '^') { next(); return pow(b, unary()); } return b; }
    function atom() {
      const t = next();
      if (!t) throw new Error('incomplete expression');
      if (t.t === 'num') return C(t.v);
      if (t.t === '(') { const v = sum(); const c = next(); if (!c || c.t !== ')') throw new Error('missing ")"'); return v; }
      if (t.t === 'id') {
        if (t.v === 'pi' || t.v === 'π') return C(Math.PI);
        if (t.v === 'j' || t.v === 'i') return C(0, 1);
        if (t.v === 'e') return C(Math.E);
        if (isFn(t)) {
          const o = next(); if (!o || o.t !== '(') throw new Error(`${t.v} needs parentheses, e.g. ${t.v}(2)`);
          const v = sum(); const c = next(); if (!c || c.t !== ')') throw new Error('missing ")"');
          return { sqrt, exp, cos, sin }[t.v](v);
        }
      }
      throw new Error(`unexpected "${t.t === 'id' ? t.v : t.t}"`);
    }
    const v = sum();
    if (p < toks.length) { const t = toks[p]; throw new Error(`unexpected "${t.t === 'num' ? t.s : t.t === 'id' ? t.v : t.t}"`); }
    if (!isFinite(v.re) || !isFinite(v.im)) throw new Error('value is not finite');
    return v;
  }
  function splitTop(s) {
    const out = []; let d = 0, cur = '';
    for (const ch of s) {
      if (ch === '(') d++;
      if (ch === ')') d--;
      if ((ch === ',' || ch === ';') && d === 0) { out.push(cur); cur = ''; } else cur += ch;
    }
    out.push(cur);
    return out;
  }
  function list(s) {
    if (!s || !s.trim()) throw new Error('empty list');
    return splitTop(s).map((x, i) => {
      if (!x.trim()) throw new Error(`entry ${i + 1} is empty`);
      try { return expr(x); } catch (e) { throw new Error(`entry ${i + 1} ("${x.trim()}"): ${e.message}`); }
    });
  }
  function realList(s) {
    return list(s).map((c, i) => {
      if (Math.abs(c.im) > 1e-12 * Math.max(1, abs(c))) throw new Error(`entry ${i + 1} is complex — this demo needs real numbers`);
      return c.re;
    });
  }
  return { expr, list, realList, splitTop };
})();

const Fmt = (() => {
  const sgn = s => String(s).replace(/-/g, MINUS);
  function rat(x, maxDen = 64, tol = 1e-9) {
    if (!isFinite(x)) return null;
    const s = x < 0 ? -1 : 1, ax = Math.abs(x);
    let h0 = 0, h1 = 1, k0 = 1, k1 = 0, b = ax;
    for (let it = 0; it < 40; it++) {
      const a = Math.floor(b), h2 = a * h1 + h0, k2 = a * k1 + k0;
      if (k2 > maxDen) break;
      h0 = h1; h1 = h2; k0 = k1; k1 = k2;
      if (Math.abs(ax - h1 / k1) <= tol * Math.max(1, ax)) return { p: s * h1, q: k1 };
      const f = b - a; if (f < 1e-12) break;
      b = 1 / f;
    }
    return null;
  }
  function dec(x, sig = 4) {
    if (!isFinite(x)) return x > 0 ? '∞' : x < 0 ? MINUS + '∞' : 'NaN';
    if (Math.abs(x) < 1e-12) return '0';
    return sgn(parseFloat(x.toPrecision(sig)).toString());
  }
  function num(x, o = {}) {
    const { maxDen = 64, sig = 4 } = o;
    if (!isFinite(x)) return dec(x);
    if (Math.abs(x) < 1e-12) return '0';
    const r = Math.round(x);
    if (Math.abs(x - r) <= 1e-9 * Math.max(1, Math.abs(x))) return sgn(String(r));
    const q = rat(x, maxDen); if (q) return sgn(`${q.p}/${q.q}`);
    return dec(x, sig);
  }
  return { rat, dec, num, sgn };
})();

// ---- presets (every result checked against np.convolve in verify/demos/conv_verify.py)
const PRESETS = [
  { id: 'l4notes', name: 'Lecture 4 notes — Table 1 (shift-and-overlap)', x: '3, 1, 0, 3, 1, 1', xs: 0, h: '2, -1, 1', hs: -1, flip: 'h',
    note: 'Lecture 4 notes §2.2.1–2.2.2: the same pair done by the table (Table 1) and by y = Hx (Eq. 18). Answer y = {6, −1↑, 2, 7, −1, 4, 0, 1}.' },
  { id: 'l4slides', name: 'Lecture 4 slides — shift-and-overlap / matrix method', x: '1, 2, 0, -4, -1', xs: 0, h: '-2, 0, 1', hs: -1, flip: 'h',
    note: 'Lecture 4 slides 10–11: x = {1↑, 2, 0, −4, −1}, h = {−2, 0↑, 1}. The slide’s table has rows h[−1 − k] … h[5 − k], i.e. n = −1 … 5.' },
  { id: 'l4extra', name: 'Lecture 4 slides — extra practice', x: '-3, 6, 2, 0, 1, 1', xs: -3, h: '1, -1', hs: -1, flip: 'h',
    note: 'Lecture 4 slide 15: x = {−3, 6, 2, 0↑, 1, 1}, h = {1, −1↑} = δ[n+1] − δ[n], so y[n] = x[n+1] − x[n].' },
  { id: 'fa25', name: 'FA2025 #3a', x: '1, 2, 3, 0, -1, -2, -3', xs: 0, h: '1, 0, 1', hs: -2, flip: 'h',
    note: 'FA2025 #3a: x = {1↑, 2, 3, 0, −1, −2, −3}, h = {1, 0, 1↑} = δ[n+2] + δ[n] (arrow on the LAST 1), so y[n] = x[n+2] + x[n].' },
  { id: 'sp25', name: 'SP2025 #4a (key’s boxed answer is wrong)', x: '1, -2, 0, 3, -1, 1', xs: -2, h: '2, -1, 3', hs: 0, flip: 'h',
    note: 'SP2025 #4a: x = {1, −2, 0↑, 3, −1, 1}, h = {2↑, −1, 3}. The key’s boxed {2, −5, 6, 0, −5, 10, −4, 3} is wrong; its own matrix column (and this demo) give {2, −5, 5↑, 0, −5, 12, −4, 3}.' },
  { id: 'fa19', name: 'FA2019 #4', x: '1, -4, 2, -1, 3, 1', xs: 0, h: '-1, 1, -1', hs: 0, flip: 'h',
    note: 'FA2019 #4: both arrows sit under the FIRST entries (x = {1↑, …}, h = {−1↑, 1, −1}), so y starts at n = 0: {−1↑, 5, −7, 7, −6, 3, −2, −1}.' },
  { id: 'sp21', name: 'SP2021 #2', x: '-1, -2, 3, -3, 2, 1', xs: 0, h: '-1, 0, 1', hs: -1, flip: 'h',
    note: 'SP2021 #2: x = {−1↑, −2, 3, −3, 2, 1}, h = {−1, 0↑, 1} = −δ[n+1] + δ[n−1], so y[n] = x[n−1] − x[n+1] and y starts at n = −1.' },
  { id: 'hw2', name: 'HW2 #5a', x: '-1, 0, 1', xs: -1, h: '1, 2, 3, 4, 5', hs: 0, flip: 'x',
    note: 'HW2 #5a: x = {−1, 0↑, 1} is the shorter sequence, so it is the one flipped (convolution commutes). x = −δ[n+1] + δ[n−1], so y[n] = h[n−1] − h[n+1].' },
  { id: 'ma', name: 'Moving average, L = 4', x: '1, 3, 2, 4, 3, 5, 4, 6', xs: 0, h: '1/4, 1/4, 1/4, 1/4', hs: 0, flip: 'h',
    note: 'Lecture 5 moving average: h[n] = ¼(u[n] − u[n−4]), so each y[n] is the average of x[n], x[n−1], x[n−2], x[n−3]. The ramp comes through smoothed; the ends ramp up and down over L − 1 = 3 samples.' },
];

// linear convolution with index bookkeeping: y starts at xs + hs
function convolve(x, xs, h, hs) {
  const N = x.length, M = h.length;
  const y = new Array(N + M - 1).fill(0);
  for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) y[i + j] += x[i] * h[j];
  const sc = Math.max(1e-300, ...y.map(Math.abs));
  return { y: y.map(v => (Math.abs(v) < 1e-12 * sc ? 0 : v)), ys: xs + hs };
}
/*CORE-END*/

(() => {
  const $ = id => document.getElementById(id);
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const MAXLEN = 40;

  // ---- theme: follow the embedding Quartz page if same-origin, else the OS
  function syncTheme() {
    let t = null;
    try { t = window.parent && window.parent !== window ? window.parent.document.documentElement.getAttribute('saved-theme') : null; } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    if (document.documentElement.getAttribute('data-theme') !== t) document.documentElement.setAttribute('data-theme', t);
  }
  syncTheme();
  try {
    if (window.parent && window.parent !== window) {
      new MutationObserver(syncTheme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['saved-theme'] });
    }
  } catch (e) {}
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);

  // ---- state
  const S = { x: [], xs: 0, h: [], hs: 0, n: 0, flip: 'h', timer: null, ok: false };
  const F = v => Fmt.num(v);                          // value formatting (integers, small fractions, decimals)
  const P = v => (v < 0 || /\//.test(F(v)) ? `(${F(v)})` : F(v));   // parenthesised for products
  const I = k => Fmt.sgn(String(k));                  // index with a real minus sign
  const shiftIdx = (n, v) => (n === 0 ? `${MINUS}${v}` : `${I(n)} ${MINUS} ${v}`);   // "2 − k", "−k", "−1 − k"

  // fixed sequence f (not flipped) and flipped sequence g
  function roles() {
    const X = { nm: 'x', v: S.x, s: S.xs, col: '--accent' }, Hh = { nm: 'h', v: S.h, s: S.hs, col: '--accent2' };
    return S.flip === 'h' ? { f: X, g: Hh } : { f: Hh, g: X };
  }
  const at = (seq, k) => (k >= seq.s && k < seq.s + seq.v.length ? seq.v[k - seq.s] : null);

  // ---- canvas helpers
  function setup(cv, cssH) {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const w = Math.max(240, Math.round(cv.getBoundingClientRect().width || cv.clientWidth || 600));
    cv.style.height = cssH + 'px';
    const W = Math.round(w * dpr), H = Math.round(cssH * dpr);
    if (cv.width !== W) cv.width = W;
    if (cv.height !== H) cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, cssH);
    return { ctx, w, h: cssH };
  }
  const font = (px, bold) => `${bold ? '600 ' : ''}${px}px "Source Sans 3", system-ui, sans-serif`;

  // one strip of stems. pts: [{k, v, col, r, faint}] ; xmap: k -> px
  function strip(ctx, box, xmap, pts, o) {
    const { x0, y0, w, h } = box;
    const top = 32, bot = 16;
    let vmax = Math.max(0, ...pts.map(p => p.v)), vmin = Math.min(0, ...pts.map(p => p.v));
    if (o.range) { vmax = Math.max(vmax, o.range); vmin = Math.min(vmin, pts.some(p => p.v < 0) || o.symmetric ? -o.range : 0); }
    if (vmax === vmin) vmax = 1;
    const sc = (h - top - bot) / (vmax - vmin);
    const Y = v => y0 + top + (vmax - v) * sc;
    // zero line
    ctx.strokeStyle = css('--muted'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, Y(0)); ctx.lineTo(x0 + w, Y(0)); ctx.stroke();
    // label
    ctx.fillStyle = css(o.labelCol || '--muted'); ctx.font = font(12.5, true); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(o.label, x0 + 4, y0 + 1);
    if (o.right) { ctx.textAlign = 'right'; ctx.fillStyle = css('--hi'); ctx.fillText(o.right, x0 + w - 4, y0 + 1); }
    const spacing = o.spacing;
    for (const p of pts) {
      const X = xmap(p.k), yv = Y(p.v);
      ctx.globalAlpha = p.faint ? 0.35 : 1;
      ctx.strokeStyle = css(p.col); ctx.fillStyle = css(p.col); ctx.lineWidth = p.r > 4 ? 2.2 : 1.6;
      ctx.beginPath(); ctx.moveTo(X, Y(0)); ctx.lineTo(X, yv); ctx.stroke();
      ctx.beginPath(); ctx.arc(X, yv, p.r || 3.5, 0, 2 * Math.PI); ctx.fill();
      if (spacing >= 20 && !p.nolabel) {
        ctx.font = font(11, p.r > 4); ctx.textAlign = 'center';
        ctx.fillStyle = css(p.faint ? '--muted' : '--fg');
        if (p.v >= 0) { ctx.textBaseline = 'bottom'; ctx.fillText(F(p.v), X, yv - 4); }
        else { ctx.textBaseline = 'top'; ctx.fillText(F(p.v), X, yv + 4); }
      }
      ctx.globalAlpha = 1;
    }
    return { Y };
  }
  function kAxis(ctx, xmap, k0, k1, y, spacing, name, mark) {
    const step = spacing >= 18 ? 1 : spacing >= 9 ? 2 : spacing >= 4 ? 5 : 10;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let k = k0; k <= k1; k++) {
      if (k % step !== 0 && k !== mark) continue;
      ctx.font = font(11.5, k === 0 || k === mark);
      ctx.fillStyle = css(k === mark ? '--hi' : k === 0 ? '--fg' : '--muted');
      ctx.fillText(I(k), xmap(k), y);
    }
    ctx.textAlign = 'right'; ctx.fillStyle = css('--muted'); ctx.font = font(12, true);
    ctx.fillText(name, ctx.canvas.width / (ctx.getTransform().a || 1) - 3, y);
  }

  // ---- rendering
  function render() {
    if (!S.ok) { fitFrame(); return; }
    const { f, g } = roles();
    const { y, ys } = convolve(S.x, S.xs, S.h, S.hs);
    const ye = ys + y.length - 1;
    const nmin = ys - 1, nmax = ye + 1;
    S.n = Math.max(nmin, Math.min(nmax, S.n));
    const n = S.n;
    const sl = $('nslider'); sl.min = nmin; sl.max = nmax; sl.value = n;
    const G = g.v.length, fe = f.s + f.v.length - 1, ge = g.s + G - 1;
    const yAt = m => (m >= ys && m <= ye ? y[m - ys] : 0);

    // overlap at this n: k with f[k] and g[n-k] both inside their index ranges
    const terms = [];
    for (let k = Math.max(f.s, n - ge); k <= Math.min(fe, n - g.s); k++) terms.push({ k, a: at(f, k), b: at(g, n - k) });
    const val = yAt(n);

    // readout for the current n
    const fk = `${f.nm}[k]`, gk = `${g.nm}[${shiftIdx(n, 'k')}]`;
    let html = `<b>n = ${I(n)}</b>: &nbsp;y[${I(n)}] = Σ<sub>k</sub> ${fk}·${gk}`;
    if (!terms.length) html += ` = 0 &nbsp;<span class="note">(no overlap)</span>`;
    else {
      html += ' = ' + terms.map(t => `${f.nm}[${I(t.k)}]${g.nm}[${I(n - t.k)}]`).join(' + ');
      html += ' = ' + terms.map(t => `${P(t.a)}·${P(t.b)}`).join(' + ') + ` = <b class="v">${F(val)}</b>`;
    }
    $('cur').innerHTML = html;

    // ---- canvas 1: shift view
    const kLo = Math.min(0, f.s - G), kHi = Math.max(0, fe + G);
    const c1 = setup($('cv1'), 390);
    const narrow = c1.w < 520;
    const padL = 10, padR = 16, W1 = c1.w - padL - padR;
    const nK = kHi - kLo + 1, sp1 = W1 / nK;
    const xm1 = k => padL + (k - kLo + 0.5) * sp1;
    const ctx = c1.ctx;
    // grid: faint line per k, stronger at k = 0, marker at k = n
    for (let k = kLo; k <= kHi; k++) {
      ctx.strokeStyle = css('--line'); ctx.lineWidth = k === 0 ? 1.6 : 0.6;
      ctx.setLineDash(k === 0 ? [] : [2, 3]);
      ctx.beginPath(); ctx.moveTo(xm1(k), 4); ctx.lineTo(xm1(k), c1.h - 22); ctx.stroke();
    }
    ctx.setLineDash([]);
    // overlap band
    if (terms.length) {
      ctx.fillStyle = css('--hi'); ctx.globalAlpha = 0.07;
      ctx.fillRect(xm1(terms[0].k) - sp1 / 2, 4, sp1 * terms.length, c1.h - 26);
      ctx.globalAlpha = 1;
    }
    const sh = (c1.h - 26) / 3;
    const fmax = Math.max(1e-12, ...f.v.map(Math.abs)), gmax = Math.max(1e-12, ...g.v.map(Math.abs));
    let pmax = 1e-12;
    for (const a of f.v) for (const b of g.v) pmax = Math.max(pmax, Math.abs(a * b));
    const anyNegF = f.v.some(v => v < 0), anyNegG = g.v.some(v => v < 0);
    const anyNegP = f.v.some(a => g.v.some(b => a * b < 0));
    strip(ctx, { x0: padL, y0: 2, w: W1, h: sh }, xm1,
      f.v.map((v, i) => ({ k: f.s + i, v, col: f.col, r: 3.8 })),
      { label: `${f.nm}[k]`, labelCol: f.col, spacing: sp1, range: fmax, symmetric: anyNegF });
    const gpts = [];
    for (let m = g.s; m <= ge; m++) gpts.push({ k: n - m, v: at(g, m), col: g.col, r: m === 0 ? 5 : 3.8 });
    strip(ctx, { x0: padL, y0: 2 + sh, w: W1, h: sh }, xm1, gpts.filter(p => p.k >= kLo && p.k <= kHi),
      { label: narrow ? `${g.nm}[${shiftIdx(n, 'k')}]` : `${g.nm}[${shiftIdx(n, 'k')}]  (flipped, then shifted by n = ${I(n)})`, labelCol: g.col, spacing: sp1, range: gmax, symmetric: anyNegG });
    strip(ctx, { x0: padL, y0: 2 + 2 * sh, w: W1, h: sh }, xm1,
      terms.map(t => ({ k: t.k, v: t.a * t.b, col: '--hi', r: 3.8 })),
      { label: `${f.nm}[k]·${g.nm}[${shiftIdx(n, 'k')}]`, labelCol: '--hi', spacing: sp1, range: pmax, symmetric: anyNegP,
        right: `Σ = y[${I(n)}] = ${F(val)}` });
    // k = n caret (where the flipped sequence's n = 0 sample sits)
    if (n >= kLo && n <= kHi) {
      const X = xm1(n), yb = c1.h - 22;
      ctx.fillStyle = css('--hi');
      ctx.beginPath(); ctx.moveTo(X, yb - 1); ctx.lineTo(X - 5, yb + 5); ctx.lineTo(X + 5, yb + 5); ctx.closePath(); ctx.fill();
    }
    kAxis(ctx, xm1, kLo, kHi, c1.h - 15, sp1, 'k', n);

    // legend
    $('leg1').innerHTML =
      `<span><i class="sw" style="background:var(${f.col})"></i>${f.nm}[k] stays put</span>` +
      `<span><i class="sw" style="background:var(${g.col})"></i>${g.nm}[${shiftIdx(n, 'k')}]: its ${g.nm}[0] sample (big dot) sits at k = n (▲)</span>` +
      `<span><i class="sw" style="background:var(--hi)"></i>products; their sum is y[n]</span>`;

    // ---- canvas 2: output
    const nLo = Math.min(0, nmin), nHi = Math.max(0, nmax);
    const c2 = setup($('cv2'), 200);
    const W2 = c2.w - padL - padR, sp2 = W2 / (nHi - nLo + 1);
    const xm2 = k => padL + (k - nLo + 0.5) * sp2;
    const ctx2 = c2.ctx;
    for (let k = nLo; k <= nHi; k++) {
      ctx2.strokeStyle = css('--line'); ctx2.lineWidth = k === 0 ? 1.6 : 0.6; ctx2.setLineDash(k === 0 ? [] : [2, 3]);
      ctx2.beginPath(); ctx2.moveTo(xm2(k), 4); ctx2.lineTo(xm2(k), c2.h - 22); ctx2.stroke();
    }
    ctx2.setLineDash([]);
    const ymax = Math.max(1e-12, ...y.map(Math.abs));
    const ypts = [];
    for (let m = nLo; m <= nHi; m++) {
      if (m < ys || m > ye) continue;
      ypts.push({ k: m, v: y[m - ys], col: m === n ? '--hi' : '--accent', r: m === n ? 5.5 : 3.8, faint: m > n });
    }
    strip(ctx2, { x0: padL, y0: 2, w: W2, h: c2.h - 24 }, xm2, ypts,
      { label: narrow ? 'y[n]' : 'y[n] = (x * h)[n]   (faint: not computed yet)', spacing: sp2, range: ymax, symmetric: y.some(v => v < 0),
        right: `y[${I(n)}] = ${F(val)}` });
    kAxis(ctx2, xm2, nLo, nHi, c2.h - 15, sp2, 'n', n);

    // ---- sequence with the n = 0 marker, and the length facts
    const seqHTML = (vals, s0) => '{' + vals.map((v, i) => `<span class="s${s0 + i === 0 ? ' z' : ''}">${F(v)}</span>`).join(', ') + '}';
    let yl = `<b>y[n]</b> = <span class="seq">${seqHTML(y, ys)}</span>`;
    yl += (ys <= 0 && ye >= 0) ? ' &nbsp;<span class="note">(↑ marks n = 0)</span>'
      : ` &nbsp;<span class="note">for n = ${I(ys)} … ${I(ye)} — n = 0 is outside the support, so y[0] = 0</span>`;
    $('yseq').innerHTML = `<b>x[n]</b> = <span class="seq">${seqHTML(S.x, S.xs)}</span>${S.xs <= 0 && S.xs + S.x.length - 1 >= 0 ? '' : ` <span class="note">(n = ${I(S.xs)} … ${I(S.xs + S.x.length - 1)})</span>`}` +
      ` &nbsp;*&nbsp; <b>h[n]</b> = <span class="seq">${seqHTML(S.h, S.hs)}</span>${S.hs <= 0 && S.hs + S.h.length - 1 >= 0 ? '' : ` <span class="note">(n = ${I(S.hs)} … ${I(S.hs + S.h.length - 1)})</span>`}<br>` + yl;
    const N = S.x.length, M = S.h.length, xe = S.xs + N - 1, he = S.hs + M - 1;
    const par = v => (v < 0 ? `(${I(v)})` : I(v));
    $('facts').innerHTML =
      `<span>x: N = ${N}, n<sub>s</sub> = ${I(S.xs)}, n<sub>e</sub> = ${I(xe)}</span>` +
      `<span>h: M = ${M}, m<sub>s</sub> = ${I(S.hs)}, m<sub>e</sub> = ${I(he)}</span>` +
      `<span>start k<sub>s</sub> = n<sub>s</sub> + m<sub>s</sub> = ${I(S.xs)} + ${par(S.hs)} = <b>${I(ys)}</b></span>` +
      `<span>end k<sub>e</sub> = n<sub>e</sub> + m<sub>e</sub> = ${I(xe)} + ${par(he)} = <b>${I(ye)}</b></span>` +
      `<span>length K = N + M − 1 = ${N} + ${M} − 1 = <b>${y.length}</b></span>`;
    const pyl = a => '[' + a.map(v => String(+v.toPrecision(12))).join(', ') + ']';
    $('py').innerHTML = `Python: <code>np.convolve(${pyl(S.x)}, ${pyl(S.h)})</code> returns these ${y.length} values but not their position — numpy has no idea where n = 0 is; the first one is at n = n<sub>s</sub> + m<sub>s</sub> = ${I(ys)}.`;

    // ---- shift-and-overlap table (Lecture 4 notes, Table 1)
    const tk0 = f.s - (G - 1), tk1 = fe + (G - 1);
    const big = (tk1 - tk0 + 1) > 44 || y.length > 44;
    $('ttitle').textContent = `Shift-and-overlap table (Lecture 4 notes, Table 1) — rows are ${g.nm}[n − k] for each n`;
    if (big) { $('tab').innerHTML = ''; $('tnote').textContent = 'Sequences too long for a readable table — shorten them to see it.'; }
    else {
      $('tnote').textContent = 'Click a row to jump to that n. Blank cells are zeros (zero extension).';
      let t = `<tr class="hd"><th class="lab">k</th>`;
      for (let k = tk0; k <= tk1; k++) t += `<th>${I(k)}</th>`;
      t += `<th class="lab" style="border:0"></th></tr><tr class="xrow"><td class="lab">${f.nm}[k]</td>`;
      for (let k = tk0; k <= tk1; k++) { const v = at(f, k); t += `<td>${v === null ? '' : F(v)}</td>`; }
      t += '<td class="res"></td></tr>';
      for (let m = ys; m <= ye; m++) {
        t += `<tr class="nr${m === n ? ' cur' : ''}" data-n="${m}"><td class="lab">${g.nm}[${shiftIdx(m, 'k')}]</td>`;
        for (let k = tk0; k <= tk1; k++) { const v = at(g, m - k); t += `<td class="g">${v === null ? '' : F(v)}</td>`; }
        const tt = [];
        for (let k = Math.max(f.s, m - ge); k <= Math.min(fe, m - g.s); k++) tt.push(`${P(at(f, k))}·${P(at(g, m - k))}`);
        t += `<td class="res">y[${I(m)}] = ${tt.join(' + ')} = <b>${F(yAt(m))}</b></td></tr>`;
      }
      $('tab').innerHTML = t;
    }

    // ---- matrix-vector form y = G f (operator matrix of the flipped sequence, Lecture 4 notes Eq. 18)
    const Gname = g.nm === 'h' ? 'H' : 'X';
    $('mtitle').textContent = `Matrix–vector form: y = ${Gname}${f.nm} (Toeplitz “operator matrix” of ${g.nm}, Lecture 4 notes Eq. 18)`;
    if (big || f.v.length > 24) { $('mat').innerHTML = ''; $('mnote').textContent = 'Too large to display — shorten the sequences.'; }
    else {
      $('mnote').innerHTML = `Row n holds ${g.nm}[n − k] for k = ${I(f.s)} … ${I(fe)}; each column is a copy of ${g.nm} shifted down one row. The highlighted row is the current n.`;
      let t = `<tr class="hd"><th class="lab">n \\ k</th>`;
      for (let k = f.s; k <= fe; k++) t += `<th>${I(k)}</th>`;
      t += `<th></th><th>${f.nm}</th><th></th><th>y</th><th></th></tr>`;
      const rows = ye - ys + 1, mid = Math.floor((rows - 1) / 2);
      for (let r = 0; r < rows; r++) {
        const m = ys + r;
        t += `<tr class="nr${m === n ? ' cur' : ''}" data-n="${m}"><td class="lab">${I(m)}</td>`;
        for (let k = f.s; k <= fe; k++) {
          const v = at(g, m - k), cls = `mH${k === f.s ? ' l' : ''}${k === fe ? ' r' : ''}${v === null || v === 0 ? ' zero' : ''}`;
          t += `<td class="${cls}">${v === null ? '0' : F(v)}</td>`;
        }
        t += `<td class="op">${r === mid ? '·' : ''}</td>`;
        t += r < f.v.length ? `<td class="mx">${F(f.v[r])}</td>` : '<td class="blank"></td>';
        t += `<td class="op">${r === mid ? '=' : ''}</td><td class="my">${F(y[r])}</td>`;
        t += `<td class="mark">${m === 0 ? '← n = 0' : ''}</td></tr>`;
      }
      $('mat').innerHTML = t;
    }
    fitFrame();
  }

  // ---- inputs
  function read() {
    const errs = [];
    let x = null, h = null;
    try { x = Parse.realList($('xin').value); } catch (e) { errs.push('x: ' + e.message); }
    try { h = Parse.realList($('hin').value); } catch (e) { errs.push('h: ' + e.message); }
    const xs = Number($('xs').value), hs = Number($('hs').value);
    if (!Number.isInteger(xs)) errs.push('the start index of x must be an integer');
    if (!Number.isInteger(hs)) errs.push('the start index of h must be an integer');
    if (x && x.length > MAXLEN) errs.push(`x: at most ${MAXLEN} samples`);
    if (h && h.length > MAXLEN) errs.push(`h: at most ${MAXLEN} samples`);
    if (Math.abs(xs) > 200 || Math.abs(hs) > 200) errs.push('keep the start indices within ±200');
    $('err').textContent = errs.join(' · ');
    if (errs.length) { S.ok = false; fitFrame(); return false; }
    Object.assign(S, { x, xs, h, hs, ok: true });
    return true;
  }
  function load(p) {
    $('xin').value = p.x; $('xs').value = p.xs; $('hin').value = p.h; $('hs').value = p.hs;
    S.flip = p.flip || 'h'; $('flip').value = S.flip;
    $('pnote').textContent = p.note || '';
    stop();
    if (read()) { S.n = S.xs + S.hs; render(); }
  }
  const sel = $('preset');
  PRESETS.forEach((p, i) => { const o = document.createElement('option'); o.value = i; o.textContent = p.name; sel.appendChild(o); });
  const oc = document.createElement('option'); oc.value = 'custom'; oc.textContent = '(your own sequences)'; oc.hidden = true; sel.appendChild(oc);
  sel.onchange = () => { if (sel.value !== 'custom') load(PRESETS[+sel.value]); };
  for (const id of ['xin', 'hin', 'xs', 'hs']) $(id).addEventListener('input', () => {
    sel.value = 'custom'; $('pnote').textContent = '';
    if (read()) render();
  });
  $('flip').onchange = e => { S.flip = e.target.value; render(); };
  $('nslider').addEventListener('input', e => { S.n = +e.target.value; render(); });
  $('prev').onclick = () => { stop(); S.n--; render(); };
  $('next').onclick = () => { stop(); S.n++; render(); };
  function stop() { if (S.timer) { clearInterval(S.timer); S.timer = null; $('play').textContent = 'play'; } }
  $('play').onclick = () => {
    if (S.timer) { stop(); return; }
    if (!S.ok) return;
    $('play').textContent = 'pause';
    S.timer = setInterval(() => {
      const mx = +$('nslider').max, mn = +$('nslider').min;
      S.n = S.n >= mx ? mn : S.n + 1; render();
    }, 900);
  };
  for (const id of ['tab', 'mat']) $(id).addEventListener('click', e => {
    const tr = e.target.closest('tr[data-n]'); if (!tr) return;
    stop(); S.n = +tr.dataset.n; render();
  });

  // ---- resize the embedding iframe to fit (same-origin Quartz page), so phones get no inner scrollbar
  let lastH = 0;
  function fitFrame() {
    try {
      const fe = window.frameElement; if (!fe) return;
      const h = Math.ceil($('wrap').getBoundingClientRect().height) + 4;
      if (Math.abs(h - lastH) > 3) { lastH = h; fe.style.height = h + 'px'; }
    } catch (e) {}
  }
  let raf = 0, lastW = 0;
  const later = () => {
    const w = Math.round($('wrap').getBoundingClientRect().width);
    if (w === lastW) return;
    lastW = w; cancelAnimationFrame(raf); raf = requestAnimationFrame(render);
  };
  window.addEventListener('resize', later);
  if (window.ResizeObserver) new ResizeObserver(later).observe($('wrap'));
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  load(PRESETS[0]);
})();
</script>
</body>
</html>
